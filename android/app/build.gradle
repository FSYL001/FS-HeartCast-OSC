plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fsheartcast.osc'
    compileSdk 34

    defaultConfig {
        applicationId "com.fsheartcast.osc"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

// 本项目不使用任何第三方/AndroidX 依赖：只用 Android 框架 API，
// 这样既能在 Android Studio 里直接构建，也能用 build-apk.ps1 离线打包。
dependencies {
}
